# Render "Blueprint" — deploys all three regional backends from this one
# repo in a single step (Render dashboard: New > Blueprint > pick this
# repo). All three services build the SAME Dockerfile (which bakes in
# all three regions' trimmed data, ~8MB total) and are told which one
# to serve purely via the REGION env var at runtime -- see the
# Dockerfile's own header for why this isn't a per-service --build-arg
# design: Render's Blueprint spec (confirmed against Render's own
# render.yaml.json schema) has no field for passing Docker build args,
# so that design doesn't actually work here. See DEPLOYMENT.md for the
# full walkthrough, including setting FRONTEND_ORIGIN once the
# Vercel/Netlify URL is known.
#
# plan: free below spins down each service after ~15min idle -- the next
# request then pays a real cold-start delay on top of the isochrone
# router's own ~30s, which can look broken. .github/workflows/keep-alive.yml
# pings all three every 10 minutes to prevent that spin-down (a real,
# free mitigation, not a full fix -- see DEPLOYMENT.md's free-tier
# section for the honest limits of this approach). Switch to
# `plan: starter` instead if/when a paid tier is available -- no cold
# starts at all, and the keep-alive workflow becomes unnecessary
# (harmless to leave running either way).
services:
  - type: web
    name: kryos-weddell
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: REGION
        value: weddell
      - key: FRONTEND_ORIGIN
        sync: false # set manually once the frontend's deployed URL is known
    plan: free
    healthCheckPath: /api/manifest

  - type: web
    name: kryos-prydz-bay
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: REGION
        value: prydz_bay
      - key: FRONTEND_ORIGIN
        sync: false
    plan: free
    healthCheckPath: /api/manifest

  - type: web
    name: kryos-ross-sea
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: REGION
        value: ross_sea
      - key: FRONTEND_ORIGIN
        sync: false
    plan: free
    healthCheckPath: /api/manifest
