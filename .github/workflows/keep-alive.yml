name: Keep Render backends warm

# Render's free tier spins a service down after ~15 min idle; the next
# request then pays a real cold-start delay (image restart, not just
# a slow response), which stacks on top of the isochrone router's own
# ~30s and can look broken to anyone opening the deployed link cold.
# This pings each region's /api/manifest (cheap, no compute, just proves
# the process is alive) often enough that Render never sees 15 idle
# minutes. A real, free mitigation -- not a full fix: GitHub Actions
# schedules can drift under load, and GitHub disables scheduled
# workflows on a repo after 60 days with no commits (a `workflow_dispatch`
# run, or any push, resets that clock). See DEPLOYMENT.md.
#
# UPDATE THE THREE URLS BELOW after deploying -- these are placeholders
# matching render.yaml's service names, not real until you've deployed.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Weddell Sea backend
        run: curl -sf --max-time 25 https://kryos-weddell.onrender.com/api/manifest > /dev/null || echo "::warning::Weddell ping failed (may just be mid cold-start)"
      - name: Ping Prydz Bay backend
        run: curl -sf --max-time 25 https://kryos-prydz-bay.onrender.com/api/manifest > /dev/null || echo "::warning::Prydz Bay ping failed (may just be mid cold-start)"
      - name: Ping Ross Sea backend
        run: curl -sf --max-time 25 https://kryos-ross-sea.onrender.com/api/manifest > /dev/null || echo "::warning::Ross Sea ping failed (may just be mid cold-start)"
